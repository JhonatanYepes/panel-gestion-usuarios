<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Gestión de Usuarios</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel-gestion">
      <h2>Panel de Gestión de Usuarios</h2>
      <hr class="linea-decorativa" />

      <!-- FORMULARIO DE REGISTRO / EDICIÓN -->
      <form id="user-form" class="formulario-registro">
        <div class="grid-campos">
          <div class="campo">
            <label for="id-user">ID:</label>
            <input
              type="number"
              id="id-user"
              placeholder="Ingresar ID"
              required
            />
          </div>

          <div class="campo">
            <label for="nombre-user">Nombre:</label>
            <input
              type="text"
              id="nombre-user"
              placeholder="Ingresar nombre"
              required
            />
          </div>

          <div class="campo">
            <label for="correo-user">Correo:</label>
            <input
              type="email"
              id="correo-user"
              placeholder="Ingresar correo"
              required
            />
          </div>

          <div class="campo">
            <label for="ciudad-user">Ciudad:</label>
            <input
              type="text"
              id="ciudad-user"
              placeholder="Ingresar Ciudad"
              required
            />
          </div>
        </div>

        <div class="contenedor-boton">
          <!-- Cambiado a type="submit" como exige la rúbrica -->
          <button type="submit" id="btn-submit" class="btn-agregar">
            Agregar
          </button>
        </div>
      </form>

      <!-- Espacio de mensajes con el ID correcto -->
      <p id="mensaje-estado" class="mensaje-exito"></p>
      <hr class="linea-separadora" />

      <!-- SECCIÓN DE BÚSQUEDA POR ID -->
      <div class="seccion-busqueda">
        <div class="campo-busqueda">
          <label for="buscar-id">Buscar por Nombre:</label>
          <div class="busqueda-fila">
            <input
              type="text"
              id="buscar-id"
              placeholder="Escribe un nombre..."
            />
            <button type="button" class="btn-buscar">Buscar</button>
          </div>
        </div>
      </div>

      <!-- TABLA REQUERIDA CON THEAD Y TBODY -->
      <div class="contenedor-tabla">
        <table id="tabla-usuarios">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Ciudad</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- JavaScript llenará este cuerpo dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Script enlazado antes de cerrar el body -->
    <script src="script.js"></script>
  </body>
</html>
